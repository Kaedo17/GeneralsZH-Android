name: Build Android APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "NDK installed:"
          ls ${ANDROID_HOME}/ndk/28.2.13676358/

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake ninja-build meson python3-pip pkg-config zip
          pip3 install meson
          echo "Build tools:"
          cmake --version
          meson --version
          ninja --version

      - name: Apply DXVK Android patch
        run: |
          cd references/fbraz3-dxvk
          git apply --check "${GITHUB_WORKSPACE}/Patches/dxvk-android.patch" 2>/dev/null || \
            git apply "${GITHUB_WORKSPACE}/Patches/dxvk-android.patch"
          echo "DXVK Android patch applied"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/**/*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache DXVK build
        uses: actions/cache@v4
        with:
          path: android/app/.cxx
          key: dxvk-cxx-${{ runner.os }}-${{ hashFiles('references/fbraz3-dxvk/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: dxvk-cxx-${{ runner.os }}-

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build APK (assembleRelease)
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GRADLE_OPTS: "-Xmx8g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m"
        run: |
          # Pass 1: let CMake FetchContent populate SDL3 sources into .cxx cache.
          # Java compilation needs org.libsdl.app.SDLActivity but Gradle's task
          # graph doesn't enforce configureCMake before compileReleaseJava.
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ${GITHUB_WORKSPACE}/build_android.log || true
          # Pass 2: now that SDL3 sources exist, the build should succeed.
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ${GITHUB_WORKSPACE}/build_android.log
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GRADLE_OPTS: "-Xmx8g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m"
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ${GITHUB_WORKSPACE}/build_android.log
          echo "Gradle build complete"

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find android/app/build/outputs -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "APK not found, checking build outputs:"
            find android/app/build/outputs -type f 2>/dev/null || echo "No outputs directory"
            echo "Build log tail:"
            tail -100 build_android.log 2>/dev/null || true
            exit 1
          fi
          echo "APK found: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsZH-Android-arm64
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-android
          path: build_android.log
          retention-days: 7
