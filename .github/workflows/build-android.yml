name: Build Android APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "NDK installed:"
          ls ${ANDROID_HOME}/ndk/28.2.13676358/

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake ninja-build meson python3-pip pkg-config zip
          pip3 install meson
          echo "Build tools:"
          cmake --version
          meson --version
          ninja --version

      - name: Apply DXVK Android patch
        run: |
          cd references/fbraz3-dxvk
          git apply --check "${GITHUB_WORKSPACE}/Patches/dxvk-android.patch" 2>/dev/null || \
            git apply "${GITHUB_WORKSPACE}/Patches/dxvk-android.patch"
          echo "DXVK Android patch applied"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/**/*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache DXVK build
        uses: actions/cache@v4
        with:
          path: android/app/.cxx
          key: dxvk-cxx-${{ runner.os }}-${{ hashFiles('references/fbraz3-dxvk/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: dxvk-cxx-${{ runner.os }}-

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build APK (assembleRelease)
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GRADLE_OPTS: "-Xmx8g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m"
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ${GITHUB_WORKSPACE}/build_android.log || true

      - name: Stage ALL native .so libraries into jniLibs
        run: |
          echo "==> Staging ALL native .so files into jniLibs/arm64-v8a/"
          JNI_LIBS="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_LIBS"

          # Find the CMake build directory (the arm64-v8a subdir under .cxx)
          CXX_BASE=$(find android/app/.cxx -maxdepth 2 -type d -name "RelWithDebInfo" 2>/dev/null | head -1)
          if [ -z "$CXX_BASE" ]; then
            echo "ERROR: No .cxx/RelWithDebInfo directory found"
            exit 1
          fi
          HASH_DIR=$(find "$CXX_BASE" -maxdepth 1 -type d ! -name "RelWithDebInfo" | head -1)
          CXX_DIR="$HASH_DIR/arm64-v8a"
          echo "CXX build dir: $CXX_DIR"

          # 1. Copy DXVK libs from the meson/ExternalProject build
          DXVK_BUILD="$CXX_DIR/_deps/dxvk-build-android"
          if [ -d "$DXVK_BUILD" ]; then
            for lib in libdxvk_d3d8.so libdxvk_d3d9.so; do
              found=$(find "$DXVK_BUILD" -name "$lib" -type f 2>/dev/null | head -1)
              if [ -n "$found" ]; then
                cp -f "$found" "$JNI_LIBS/$lib"
                echo "  staged DXVK $lib ($(stat -c%s "$JNI_LIBS/$lib") bytes)"
              fi
            done
          fi

          # 2. Also check CMAKE_BINARY_DIR root (dx8.cmake copies there too)
          for lib in libdxvk_d3d8.so libdxvk_d3d9.so; do
            if [ ! -f "$JNI_LIBS/$lib" ] && [ -f "$CXX_DIR/$lib" ]; then
              cp -f "$CXX_DIR/$lib" "$JNI_LIBS/$lib"
              echo "  staged $lib from cmake root ($(stat -c%s "$JNI_LIBS/$lib") bytes)"
            fi
          done

          # 3. Copy all other .so files from the build tree
          for lib in libSDL3.so libSDL3_image.so libopenal.so libfreetype.so libglm.so libgamespy.so; do
            found=$(find "$CXX_DIR" -maxdepth 3 -name "$lib" -type f 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              cp -f "$found" "$JNI_LIBS/$lib"
              echo "  staged $lib ($(stat -c%s "$JNI_LIBS/$lib") bytes)"
            fi
          done

          # 4. Copy libmain.so and libmain_generals.so from CMake build output
          for lib in libmain.so libmain_generals.so; do
            found=$(find "$CXX_DIR" -maxdepth 4 -name "$lib" -type f 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              cp -f "$found" "$JNI_LIBS/$lib"
              echo "  staged $lib ($(stat -c%s "$JNI_LIBS/$lib") bytes)"
            fi
          done

          # 5. Stage libc++_shared.so from NDK
          NDK_LIB="/usr/local/lib/android/sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          if [ -f "$NDK_LIB" ]; then
            cp -f "$NDK_LIB" "$JNI_LIBS/libc++_shared.so"
            echo "  staged libc++_shared.so"
          fi

          echo ""
          echo "=== jniLibs contents ==="
          ls -lh "$JNI_LIBS/"

          # Verify DXVK is present
          if [ ! -f "$JNI_LIBS/libdxvk_d3d9.so" ]; then
            echo "WARNING: libdxvk_d3d9.so NOT staged! Searching entire build tree..."
            find "$CXX_BASE" -name "libdxvk_d3d9.so" -type f 2>/dev/null
          fi

      - name: Build APK (final packaging)
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GRADLE_OPTS: "-Xmx8g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m"
        run: |
          # Pass 2: repackage with all staged .so files (skip native rebuild)
          ./gradlew assembleRelease --no-daemon -PSAGE_SKIP_NATIVE_BUILD=true --stacktrace 2>&1 | tee -a ${GITHUB_WORKSPACE}/build_android.log

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find android/app/build/outputs -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "APK not found, checking build outputs:"
            find android/app/build/outputs -type f 2>/dev/null || echo "No outputs directory"
            echo "Build log tail:"
            tail -100 build_android.log 2>/dev/null || true
            exit 1
          fi
          echo "APK found: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsZH-Android-arm64
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-android
          path: build_android.log
          retention-days: 7
